name: KORA Payments CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payments-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:15.14.1.167
        env:
          POSTGRES_DB: kora_ci
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: local_ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: kora_ci
      PGUSER: postgres
      PGPASSWORD: local_ci_fixture_only
      DATABASE_URL: postgresql://postgres:local_ci_fixture_only@localhost:5432/kora_ci

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check committed changes for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="HEAD^"
          fi
          git diff --check "$base" HEAD

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prepare disposable Auth confirmation schema
        run: >-
          psql -U supabase_admin -v ON_ERROR_STOP=1
          -c "SET ROLE supabase_auth_admin;
          ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS email_confirmed_at timestamptz;"

      - name: Bootstrap disposable Supabase compatibility schemas
        run: psql -v ON_ERROR_STOP=1 -f tests/payments/sql/bootstrap.sql

      - name: Validate and replay canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -print | sort)
          if [[ ${#migrations[@]} -eq 0 ]]; then
            echo "MIGRATION REPLAY: FAIL (no migrations found)"
            exit 1
          fi

          declare -A seen_prefixes=()
          for migration in "${migrations[@]}"; do
            name=$(basename "$migration")
            if [[ ! "$name" =~ ^([0-9]{3})_[a-z0-9][a-z0-9_]*\.sql$ ]]; then
              echo "MIGRATION REPLAY: FAIL (invalid canonical name: $name)"
              exit 1
            fi
            prefix=${BASH_REMATCH[1]}
            if [[ -n "${seen_prefixes[$prefix]:-}" ]]; then
              echo "MIGRATION REPLAY: FAIL (duplicate prefix $prefix: ${seen_prefixes[$prefix]} and $name)"
              exit 1
            fi
            seen_prefixes[$prefix]=$name
          done

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            if ! psql -v ON_ERROR_STOP=1 -f "$migration"; then
              echo "MIGRATION REPLAY: FAIL ($migration)"
              exit 1
            fi
          done
          echo "MIGRATION REPLAY: PASS (${#migrations[@]} migrations)"

      - name: Prove SC-004 HB1 fails closed when migration 040 is absent
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          db=kora_sc004_r5_hb1
          cleanup() { dropdb --if-exists -U supabase_admin "$db" >/dev/null 2>&1; }
          trap cleanup EXIT
          createdb -U supabase_admin --template=kora_ci "$db"
          export PGDATABASE="$db"

          for migration in $(find supabase/migrations -maxdepth 1 -type f -print | sort); do
            name=$(basename "$migration")
            prefix=${name%%_*}
            if [[ "$prefix" =~ ^[0-9]{3}$ ]] && (( 10#$prefix < 40 )); then
              psql -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done

          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.tenants(id,nome,slug) values
            ('fa000000-0000-0000-0000-000000000001','HB1 Preflight A','sc004-r5-hb1-a'),
            ('fa000000-0000-0000-0000-000000000002','HB1 Preflight B','sc004-r5-hb1-b');
          insert into public.cursos(id,tenant_id,nome) values
            ('fb000000-0000-0000-0000-000000000001','fa000000-0000-0000-0000-000000000002','HB1 Course B');
          insert into public.disciplinas(id,curso_id,tenant_id,nome) values
            ('fc000000-0000-0000-0000-000000000001','fb000000-0000-0000-0000-000000000001','fa000000-0000-0000-0000-000000000001','HB1 Corrupt Subject');
          SQL

          set +e
          preflight_output=$(psql -v ON_ERROR_STOP=1 -f supabase/migrations/040_kora_school_cross_tenant_integrity.sql 2>&1)
          preflight_status=$?
          set -e
          printf '%s\n' "$preflight_output"
          if [[ $preflight_status -eq 0 ]]; then
            echo 'SC-004 HB1 FAIL: migration 040 unexpectedly succeeded without its preflight target'
            exit 1
          fi
          if [[ "$preflight_output" != *'SC003-R01 TENANT_MISMATCH count=1'* ]]; then
            echo 'SC-004 HB1 FAIL: expected tenant mismatch was not reported'
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -At <<'SQL' | grep -Fx 'HB1_PRECHECK_UNCHANGED|1|fa000000-0000-0000-0000-000000000001|fa000000-0000-0000-0000-000000000002'
          select 'HB1_PRECHECK_UNCHANGED',count(*),d.tenant_id,c.tenant_id
          from public.disciplinas d join public.cursos c on c.id=d.curso_id
          where d.id='fc000000-0000-0000-0000-000000000001'
          group by d.tenant_id,c.tenant_id;
          SQL
          psql -v ON_ERROR_STOP=1 -At <<'SQL' | grep -Fx 'HB1_MIGRATION_040_NOT_APPLIED'
          select case
            when not exists(select 1 from information_schema.columns where table_schema='public' and table_name='avaliacao_questoes' and column_name='tenant_id')
             and not exists(select 1 from pg_constraint where conname like '%\_sc003' escape '\')
            then 'HB1_MIGRATION_040_NOT_APPLIED' else 'HB1_MIGRATION_040_PARTIALLY_APPLIED' end;
          SQL
          echo 'SC-004 HB1 PREFLIGHT: PASS'

      - name: Run School session authority negative tests
        run: psql -v ON_ERROR_STOP=1 -f tests/school/sql/session_authority_qa.sql

      - name: Run School cross-tenant academic integrity tests
        run: psql -v ON_ERROR_STOP=1 -f tests/school/sql/cross_tenant_academic_integrity_qa.sql

      - name: Run School SC-004 A/B fail-closed security suite
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          \i tests/school/sql/sc004_ab_qa.sql
          \i tests/school/sql/sc004_cd_mutation_qa.sql
          SQL

      - name: Run real PostgreSQL payment invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/payments/sql/p0_payments_qa.sql

      - name: Run PostgreSQL Payments API auth invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/payments/sql/p1_pay_api_auth_qa.sql

      - name: Run PostgreSQL Payments API idempotency and external reference invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/payments/sql/p1_pay_api_idempotency_qa.sql

      - name: Run PostgreSQL Customer API foundation invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/payments/sql/p1_pay_api_customer_foundation_qa.sql

      - name: Run webhook concurrency with two connections
        shell: bash
        run: bash tests/payments/sql/concurrency.sh

      - name: Run concurrent payment intent creation
        shell: bash
        run: bash tests/payments/sql/intent-concurrency.sh

      - name: Run concurrent HTTP idempotency acquisition
        shell: bash
        run: bash tests/payments/sql/idempotency-concurrency.sh

      - name: Run concurrent Customer creation
        shell: bash
        run: bash tests/payments/sql/customer-concurrency.sh

      - name: Run Node payment tests
        run: npm ci && npm run test:payments

      - name: Run Node Payments API auth tests
        run: npm run test:payments:auth

      - name: Run Node Payments API idempotency tests
        run: npm run test:payments:idempotency

      - name: Run Payments API foundation and contract tests
        run: npm run test:payments:contract

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint

      - name: Check UTF-8 encoding
        run: npm run check:encoding

      - name: Deno check Payments Edge Functions
        run: |
          deno check supabase/functions/asaas-webhook/index.ts
          deno check supabase/functions/pix-create/index.ts
          deno check supabase/functions/pix-webhook/index.ts
          deno check supabase/functions/payments-api-v1/index.ts
