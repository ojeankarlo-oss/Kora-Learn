openapi: 3.1.0
info:
  title: KORA Payments API
  version: 1.0.0
  description: >-
    Versioned HTTP API for KORA Payments. Gate 1 exposes Customer creation
    as its only mutation; no money-moving endpoint (invoices, payment intents,
    payments, refunds) is exposed in this phase.
servers:
  - url: https://{supabaseProject}.supabase.co/functions/v1/payments-api-v1
    variables:
      supabaseProject:
        default: project-ref
        description: Supabase project reference used by the deployed Edge Function.
tags:
  - name: Foundation
    description: Non-financial API foundation endpoints.
  - name: Customers
    description: Customer management endpoints.
paths:
  /v1:
    get:
      tags: [Foundation]
      operationId: getPaymentsApiMetadata
      summary: Return API metadata
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: API metadata
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/health:
    get:
      tags: [Foundation]
      operationId: getPaymentsApiHealth
      summary: Return minimal public health status
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Minimal health response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: >-
        Requires an M2M credential with the `customers:write` scope. The tenant
        and application are derived from the credential; tenant identifiers in
        the body, query string or `X-Tenant-Id` headers are rejected with 400.
        The operation is idempotent per tenant, application, method, operation
        and `Idempotency-Key`. Retrying the same key with the same canonical
        body replays the original outcome without creating another customer:
        a created customer replays as 201 with the same `data`, and a recorded
        deterministic failure (400 or 409) replays the same error. Replayed
        responses carry the current request's `request_id`. Reusing a key with a
        different body returns 409. This operation is not rate limited in Gate 1.
      security:
        - M2MBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer created, or the original creation replayed for the same Idempotency-Key and body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: >-
            Invalid or missing Idempotency-Key, invalid JSON or body fields,
            caller-supplied tenant authority, or an application without an
            active billing account (the latter is recorded and replayed for the same key).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            `conflict`. The Idempotency-Key was reused with a different body; the
            `external_reference` already identifies a customer for this tenant and
            application (recorded and replayed for the same key); or an equivalent
            request with the same key is still in progress, in which case
            `Retry-After` is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >-
            `provider_unavailable`. A previous attempt with this Idempotency-Key
            failed transiently and must not be retried before `Retry-After` seconds.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    M2MBearer:
      type: http
      scheme: bearer
      bearerFormat: KORA-Payments-Credential
      description: >-
        M2M credential issued server-side by the canonical payment API
        credential RPC. The tenant is derived from credential → application →
        tenant; caller-supplied tenant authority is never accepted.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional safe correlation ID. Invalid values are replaced server-side.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required on every mutation. Leading and trailing whitespace is trimmed
        before validation; missing, empty or invalid keys return 400 before any
        idempotency record is created.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  headers:
    XRequestId:
      description: Server-generated or safely accepted request correlation ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RetryAfter:
      description: Seconds to wait before retrying the same request.
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_credential, insufficient_scope, resource_not_found, conflict, semantic_error, rate_limited, internal_error, provider_unavailable]
        message:
          type: string
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: array
          items: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Integer minor units bounded by PostgreSQL integer persistence. BRL 12990 represents R$129,90.
        currency:
          $ref: '#/components/schemas/Currency'
    Currency:
      type: string
      enum: [BRL]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [ok, version]
          properties:
            ok:
              type: boolean
            version:
              type: string
              const: v1
        request_id:
          type: string
    MetadataResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [name, version, status]
          properties:
            name:
              type: string
            version:
              type: string
              const: v1
            status:
              type: string
              const: foundation
        request_id:
          type: string
    CustomerRequest:
      type: object
      additionalProperties: false
      required: [name, external_reference]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Customer full name. Trimmed; must not be blank.
        email:
          type: [string, 'null']
          maxLength: 320
          description: >-
            Optional customer email address. Omitted, null or blank values are
            stored as null. The value is trimmed and limited to 320 characters;
            its format is not validated in this phase.
        external_reference:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,159}$'
          description: >-
            Consumer-provided correlation ID, unique per tenant and application.
            Leading and trailing whitespace is trimmed before validation.
    CustomerResponse:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, external_reference, created_at]
          properties:
            id:
              type: string
              format: uuid
              description: KORA Payments customer UUID.
            external_reference:
              type: string
              description: Echo of the provided external_reference.
            created_at:
              type: string
              format: date-time
              description: Customer creation timestamp.
        request_id:
          type: string
  responses:
    MethodNotAllowed:
      description: Method not supported for this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal error without implementation details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid or missing M2M credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient scope for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
